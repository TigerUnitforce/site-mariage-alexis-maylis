name: Disponibilités des hébergements

on:
  schedule:
    - cron: '17 * * * *'   # toutes les heures
  workflow_dispatch:        # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: disponibilites
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lire les calendriers iCal
        run: node scripts/update-disponibilites.mjs
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
          NIGHT: '2027-07-30'

      - name: Publier si les statuts ont changé
        run: |
          if [ -n "$(git status --porcelain disponibilites.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add disponibilites.json
            git commit -m "Met à jour les disponibilités des hébergements"
            git push
          fi
